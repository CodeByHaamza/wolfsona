name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test:coverage

      - name: Garde-fou — aucun asset sous licence dans le dépôt
        run: |
          if git ls-files 'assets/arcanes/**' | grep -vE '(\.gitkeep|README\.md)$' | grep -q .; then
            echo "::error::Des assets sous licence ont été commités. Voir docs/ASSETS.md."
            exit 1
          fi
